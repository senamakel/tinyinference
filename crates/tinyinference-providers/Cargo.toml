[package]
name = "tinyinference-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider routing, authentication protocols, and error classification for TinyInference."
documentation = "https://docs.rs/tinyinference-providers"
readme = "../../README.md"
keywords = ["llm", "inference", "oauth", "providers"]
categories = ["api-bindings", "authentication"]

[dependencies]
base64 = "0.23"
rand = "0.10"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Storage ports only (the `SecretStore` holding the short-lived PKCE state);
# the host decides which driver backs them.
tinystoragedrivers-api = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6d6ec635be0f36339731eed73fac5c89bde36e84" }
tracing = { workspace = true }
url = { workspace = true }
zeroize = "1"

[dev-dependencies]
axum = { workspace = true }
tinystoragedrivers-testkit = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6d6ec635be0f36339731eed73fac5c89bde36e84" }
tinystoragedrivers-types = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "6d6ec635be0f36339731eed73fac5c89bde36e84" }
tokio = { workspace = true, features = ["macros", "rt", "net"] }

[lints]
workspace = true
