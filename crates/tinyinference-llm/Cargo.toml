[package]
name = "tinyinference-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral language-model, streaming, and hosted-provider APIs for Rust."
documentation = "https://docs.rs/tinyinference-llm"
readme = "../../README.md"
keywords = ["llm", "inference", "streaming", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous"]

[features]
default = []
# Generic OpenAI-compatible `/chat/completions` + `/models` axum handlers over a
# host `ChatBackend` (lives here, not in tinyinference-providers: this crate
# already depends on providers, so the reverse edge would be a cycle).
server-http = ["dep:axum", "dep:uuid"]

[dependencies]
axum = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
base64 = "0.23"
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tinyinference-providers = { version = "0.4.0", path = "../tinyinference-providers" }
tinyinference-core = { version = "0.4.0", path = "../tinyinference-core" }
# The model-facing tool protocol: prompt-guided rendering, text-mode parsing,
# argument repair, and streaming scrub. Owned once, in TinyTools, so this
# adapter and every host share one grammar table.
tinytools-agent = { version = "0.6.0", git = "https://github.com/tinyhumansai/tinytools", rev = "1ec3468f6602b69b955a0e94105ed63abb5aa98c" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
uuid = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
